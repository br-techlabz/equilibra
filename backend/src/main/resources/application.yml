# ============================================================
# Equilibra API - Configuração Base
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: equilibra-api

  # Configuração do DataSource (valores via variáveis de ambiente)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/equilibra?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:equilibra}
    password: ${SPRING_DATASOURCE_PASSWORD:equilibra}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      auto-commit: false

  # Configuração JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          lob:
            non_contextual_creation: true
        connection:
          provider_disables_autocommit: true

  # Configuração Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Initial baseline"
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  # Configuração de logging
  config:
    import: "optional:file:.env[.properties]"

# Configuração Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    defaults:
      enabled: true
  info:
    env:
      enabled: true

# Logging
logging:
  level:
    br.com.equilibra: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId:-no-request-id}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId:-no-request-id}] %-5level %logger{36} - %msg%n"
  file:
    name: logs/equilibra-api.log

# Segurança / JWT
# Secret padrão é apenas para desenvolvimento local/testes; em produção use EQUILIBRA_JWT_SECRET externo e com alta entropia.
equilibra:
  security:
    jwt:
      issuer: ${EQUILIBRA_JWT_ISSUER:equilibra-api}
      access-token-ttl: ${EQUILIBRA_JWT_ACCESS_TOKEN_TTL:15m}
      secret: ${EQUILIBRA_JWT_SECRET:dev-only-change-me-not-for-production-32-bytes-minimum}

# OpenAPI/Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: br.com.equilibra
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

---
# ============================================================
# Profile: docker
# ============================================================
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/equilibra?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:equilibra}
    password: ${SPRING_DATASOURCE_PASSWORD:equilibra}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    br.com.equilibra: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

---
# ============================================================
# Profile: dev
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false
  devtools:
    restart:
      enabled: true

logging:
  level:
    org.springframework.security: DEBUG

---
# ============================================================
# Profile: test
# ============================================================
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:mysql:8.0:///equilibra_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&connectionAttributes=autoCommit:false
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: false
    clean-on-validation-error: true
    validate-on-migrate: true

logging:
  level:
    br.com.equilibra: DEBUG
    org.testcontainers: INFO

# Segurança / JWT - Test profile
equilibra:
  security:
    jwt:
      issuer: equilibra-api
      access-token-ttl: 15m
      secret: test-secret-with-at-least-32-bytes-for-hs256-algorithm
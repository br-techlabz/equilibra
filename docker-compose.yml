version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: equilibra-mysql
    environment:
      MYSQL_DATABASE: equilibra
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-equilibra}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-equilibra}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - equilibra-network

  # Backend Spring Boot (placeholder - será configurado na TASK-0.2)

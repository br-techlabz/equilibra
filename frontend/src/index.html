<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Equilibra</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { visibility: hidden; }
    body.fonts-ready { visibility: visible; }
  </style>
  <script>
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { document.body.classList.add('fonts-ready'); });
    } else {
      document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('fonts-ready'); });
    }
    setTimeout(function () { document.body.classList.add('fonts-ready'); }, 2500);
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>

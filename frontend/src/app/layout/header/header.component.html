<mat-toolbar class="topbar" color="primary" role="navigation" aria-label="Barra de ferramentas principal">
  <!-- Mobile Menu Button -->
  <button
    mat-icon-button
    class="menu-button"
    (click)="onMenuClick()"
    matTooltip="Abrir menu"
    aria-label="Abrir menu de navegação"
    [attr.aria-expanded]="!sidebarCollapsed()">
    <mat-icon>{{ sidebarCollapsed() ? 'menu_open' : 'menu' }}</mat-icon>
  </button>

  <!-- Sidebar Collapse Toggle (Desktop) -->
  <button
    mat-icon-button
    class="collapse-toggle"
    (click)="onSidebarCollapseToggle()"
    [matTooltip]="sidebarCollapsed() ? 'Expandir sidebar' : 'Recolher sidebar'"
    [attr.aria-label]="sidebarCollapsed() ? 'Expandir sidebar' : 'Recolher sidebar'"
    *ngIf="!sidebarCollapsed()">
    <mat-icon>chevron_left</mat-icon>
  </button>

  <button
    mat-icon-button
    class="collapse-toggle expand"
    (click)="onSidebarCollapseToggle()"
    matTooltip="Expandir sidebar"
    aria-label="Expandir sidebar"
    *ngIf="sidebarCollapsed()">
    <mat-icon>chevron_right</mat-icon>
  </button>

  <!-- Brand / App Title -->
  <span class="toolbar-brand" [class.hidden]="sidebarCollapsed()">
    <mat-icon class="brand-icon">account_balance_wallet</mat-icon>
    <span class="brand-text">Equilibra</span>
  </span>

  <span class="toolbar-spacer"></span>

  <!-- Breadcrumbs (Desktop) -->
  <div class="breadcrumbs" [class.hidden]="sidebarCollapsed()">
    <ng-content select="[breadcrumb]"></ng-content>
  </div>

  <span class="toolbar-spacer"></span>

  <!-- User Menu -->
  <div class="user-area">
    <button
      mat-icon-button
      class="user-button"
      [matMenuTriggerFor]="userMenu"
      aria-label="Menu do usuário"
      matTooltip="Conta do usuário">
      <div class="user-avatar">
        <mat-icon>account_circle</mat-icon>
      </div>
      <span class="user-name" [class.hidden]="sidebarCollapsed()">{{ userEmail() }}</span>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before" yPosition="below" class="user-menu">
      <div class="menu-header">
        <div class="menu-user-avatar">
          <mat-icon>account_circle</mat-icon>
        </div>
        <div class="menu-user-info">
          <span class="menu-user-email">{{ userEmail() }}</span>
          <span class="menu-user-role">Usuário</span>
        </div>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>

<mat-toolbar class="header-toolbar" color="primary">
  <button
    mat-icon-button
    class="menu-button"
    (click)="onMenuClick()"
    matTooltip="Abrir menu"
    aria-label="Abrir menu de navegação">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="header-title">Equilibra</span>

  <span class="header-spacer"></span>

  <div class="header-user-area">
    <button
      mat-icon-button
      [matMenuTriggerFor]="userMenu"
      aria-label="Menu do usuário"
      matTooltip="Conta do usuário"
      class="user-button">
      <mat-icon>account_circle</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before" yPosition="below">
      <div class="menu-user-info">
        <mat-icon>account_circle</mat-icon>
        <span class="menu-user-email">{{ userEmail() }}</span>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout.emit()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>

<mat-toolbar class="topbar" color="primary" role="navigation" aria-label="Barra de ferramentas principal">
  <!-- Hamburger Menu -->
  <button
    mat-icon-button
    class="menu-button"
    (click)="onMenuClick()"
    matTooltip="Abrir ou recolher menu"
    aria-label="Abrir ou recolher menu de navegação"
    aria-controls="main-navigation"
    [attr.aria-expanded]="!sidebarCollapsed()">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="toolbar-spacer"></span>

  <!-- Breadcrumbs (Desktop) -->
  <div class="breadcrumbs" [class.hidden]="sidebarCollapsed()">
    <ng-content select="[breadcrumb]"></ng-content>
  </div>

  <span class="toolbar-spacer"></span>

  <!-- User Menu -->
  <div class="user-area">
    <button
      mat-icon-button
      class="user-button"
      [matMenuTriggerFor]="userMenu"
      aria-label="Menu do usuário"
      matTooltip="Conta do usuário">
      <div class="user-avatar">
        <mat-icon>account_circle</mat-icon>
      </div>
      <span class="user-name" [class.hidden]="sidebarCollapsed()">{{ userEmail() }}</span>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before" yPosition="below" class="user-menu">
      <div class="menu-header">
        <div class="menu-user-avatar">
          <mat-icon>account_circle</mat-icon>
        </div>
        <div class="menu-user-info">
          <span class="menu-user-email">{{ userEmail() }}</span>
          <span class="menu-user-role">Usuário</span>
        </div>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>

<mat-sidenav-container class="shell-container" [class.mobile]="isMobile()" [class.sidebar-collapsed]="sidebarCollapsed()">
  <mat-sidenav
    #sidenav
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    (closed)="onSidebarClose()"
    class="shell-sidenav"
    role="navigation"
    aria-label="Navegação principal"
    [attr.aria-hidden]="isMobile() && !sidebarOpened()">
    <app-sidebar
      [collapsed]="sidebarCollapsed()"
      [isMobile]="isMobile()"
      (navigationClick)="onSidebarClose()"
      (logout)="onLogout()" />
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <app-header
      [userEmail]="currentUserEmail()"
      [sidebarCollapsed]="sidebarCollapsed()"
      (menuToggle)="onMenuToggle()"
      (logout)="onLogout()">
      <app-breadcrumb></app-breadcrumb>
    </app-header>

    <main class="main-content">
      <div class="content-container">
        <router-outlet />
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
